<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Essay Reader</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
    <style>
        body { 
            font-family: system-ui, -apple-system, sans-serif; 
            max-width: 800px; 
            margin: 40px auto; 
            padding: 0 20px; 
            line-height: 1.6; 
            color: #2d3748;
        }
        .nav-link {
            display: inline-block;
            margin-bottom: 24px;
            text-decoration: none;
            color: #2b6cb0;
            font-weight: 600;
            font-size: 1.1rem;
        }
        .nav-link:hover { text-decoration: underline; }
        #essay-content { min-height: 200px; }
        .controls { 
            position: fixed; 
            bottom: 20px; 
            right: 20px; 
            display: flex; 
            gap: 10px; 
        }
        button { 
            padding: 10px 15px; 
            border: none; 
            border-radius: 6px; 
            cursor: pointer; 
            color: white; 
            font-weight: 600;
        }
    </style>
</head>
<body>

    <a href="index.html" class="nav-link">← Back to Main Hub</a>

    <main id="essay-content">
        <h1 id="essay-title">Loading...</h1>
        <div id="essay-body">Fetching content...</div>
    </main>

    <div class="controls">
        <button onclick="enableEditing()" style="background: #1a202c;">✏️ Edit</button>
        <button onclick="saveEssay()" style="background: #2b6cb0;">💾 Save Live</button>
    </div>

    <script>
        const CONFIG = { password: 'englishlanguage123' };
        const SUPABASE_URL = 'https://ltayjvtqpoapgxxhhiwm.supabase.co'; 
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imx0YXlqdnRxcG9hcGd4eGhoaXdtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkzMDUwNDYsImV4cCI6MjEwNDg4MTA0Nn0.NvUJ3n-9dRIuNEriKa0YTNp3sZA9YTScxQrksfEchCI';
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        const urlParams = new URLSearchParams(window.location.search);
        const ESSAY_ID = urlParams.get('id') || 'default_essay';

        window.addEventListener('DOMContentLoaded', async () => {
            const { data } = await supabaseClient
                .from('portfolio_data')
                .select('content')
                .eq('id', ESSAY_ID)
                .maybeSingle();

            if (data && data.content) {
                document.getElementById('essay-content').innerHTML = data.content;
            } else {
                const titleText = ESSAY_ID.replace(/_/g, ' ').toUpperCase();
                document.getElementById('essay-content').innerHTML = `<h1>${titleText}</h1><p>Click Edit to write content for this post...</p>`;
            }
        });

        function enableEditing() {
            if (prompt("Enter password:") !== CONFIG.password) return alert("Incorrect password");
            const area = document.getElementById('essay-content');
            area.contentEditable = "true";
            area.style.outline = "2px dashed #2b6cb0";
            area.style.padding = "10px";
            area.style.borderRadius = "6px";
        }

        async function saveEssay() {
            const area = document.getElementById('essay-content');
            area.removeAttribute('contenteditable');
            area.style.outline = "";
            area.style.padding = "";

            const { error } = await supabaseClient
                .from('portfolio_data')
                .upsert({ id: ESSAY_ID, content: area.innerHTML });

            if (error) {
                alert("Error saving: " + error.message);
            } else {
                alert("Saved live! This post will now automatically show on the main hub.");
            }
        }
    </script>
</body>
</html>
