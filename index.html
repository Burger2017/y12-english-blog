<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Y12 English Portfolio Hub</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
    <style>
        body { 
            font-family: system-ui, -apple-system, sans-serif; 
            max-width: 800px; 
            margin: 40px auto; 
            padding: 0 20px; 
            line-height: 1.6; 
            color: #2d3748;
        }
        h1 { border-bottom: 2px solid #e2e8f0; padding-bottom: 10px; }
        .essay-list { margin-top: 20px; }
        .essay-list a { 
            display: block; 
            margin-bottom: 12px; 
            font-size: 1.1rem; 
            color: #2b6cb0; 
            text-decoration: none; 
            font-weight: 500;
        }
        .essay-list a:hover { text-decoration: underline; }
        #hub-content { min-height: 150px; }
        .controls { 
            position: fixed; 
            bottom: 20px; 
            right: 20px; 
            display: flex; 
            gap: 10px; 
        }
        button { 
            padding: 10px 15px; 
            border: none; 
            border-radius: 6px; 
            cursor: pointer; 
            color: white; 
            font-weight: 600;
        }
    </style>
</head>
<body>

    <!-- Main Hub Editable Area -->
    <main id="hub-content">
        <h1>Year 12 English Blog Hub</h1>
        <p>Welcome to the central portfolio. Select an essay below to read or edit:</p>
        
        <div class="essay-list">
            <!-- Updated links targeting the master template router -->
            <a href="/y12-english-blog/essay.html?id=history_of_fashion">📄 History of Fashion</a>
        </div>
    </main>

    <!-- Floating Live Controls -->
    <div class="controls">
        <button onclick="enableEditing()" style="background: #1a202c;">✏️ Live Edit</button>
        <button onclick="saveHub()" style="background: #2b6cb0;">💾 Save & Sync</button>
    </div>

    <script>
        const CONFIG = { password: 'englishlanguage123' };
        const SUPABASE_URL = 'https://ltayjvtqpoapgxxhhiwm.supabase.co'; 
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imx0YXlqdnRxcG9hcGd4eGhoaXdtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkzMDUwNDYsImV4cCI6MjEwNDg4MTA0Nn0.NvUJ3n-9dRIuNEriKa0YTNp3sZA9YTScxQrksfEchCI';
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        const HUB_ID = 'hub_layout';

        // Load saved hub structure from database on startup
        window.addEventListener('DOMContentLoaded', async () => {
            const { data } = await supabaseClient
                .from('portfolio_data')
                .select('content')
                .eq('id', HUB_ID)
                .maybeSingle();

            if (data && data.content) {
                document.getElementById('hub-content').innerHTML = data.content;
            }
        });

        // Enable live editing in browser
        function enableEditing() {
            if (prompt("Enter password:") !== CONFIG.password) return alert("Incorrect password");
            const area = document.getElementById('hub-content');
            area.contentEditable = "true";
            area.style.outline = "2px dashed #2b6cb0";
            area.style.padding = "10px";
            area.style.borderRadius = "6px";
        }

        // Save live hub layout changes directly to database
        async function saveHub() {
            const area = document.getElementById('hub-content');
            area.removeAttribute('contenteditable');
            area.style.outline = "";
            area.style.padding = "";

            const { error } = await supabaseClient
                .from('portfolio_data')
                .upsert({ id: HUB_ID, content: area.innerHTML });

            if (error) {
                alert("Error saving: " + error.message);
            } else {
                alert("Hub layout saved live!");
            }
        }
    </script>
</body>
</html>
