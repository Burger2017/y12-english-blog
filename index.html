<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Y12 English Language Portfolio</title>
    <link rel="stylesheet" href="style.css">
    <!-- Updated Supabase JS Bundle CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
</head>
<body>

    <header>
        <h1>English Language Portfolio</h1>
        <p>Year 12 A-Level Collaborative Writing</p>
    </header>

    <main class="hub-container" id="hub-container">
        <!-- Initial default structure -->
        <section class="topic-section">
            <h2 class="main-heading">Fashion</h2>
            <p class="topic-description">PLACEHOLDER</p>
            
            <ul class="essay-links-list">
                <li>
                    <a href="essays/history-of-fashion.html" class="sub-heading-link">
                        <span class="genre-tag">Informative</span>
                        <strong>The History of Fashion:</strong>
                        <span class="essay-desc">Brief desc</span>
                    </a>
                </li>
                <li>
                    <a href="essays/fast-fashion.html" class="sub-heading-link">
                        <span class="genre-tag">Opinion</span>
                        <strong>Title:</strong>
                        <span class="essay-desc">Brief desc</span>
                    </a>
                </li>
            </ul>
        </section>
    </main>

    <!-- Floating Controls -->
    <div id="editor-controls" style="position: fixed; bottom: 20px; right: 20px; z-index: 1000; display: flex; gap: 10px;">
        <button id="edit-btn" onclick="toggleEditMode()" style="padding: 12px 20px; background: #1a202c; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; box-shadow: 0 4px 10px rgba(0,0,0,0.15);">
            ✏️ Live Edit
        </button>
        <button id="add-section-btn" onclick="addMainHeading()" style="display: none; padding: 12px 20px; background: #2b6cb0; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; box-shadow: 0 4px 10px rgba(0,0,0,0.15);">
            ➕ Add Main Heading
        </button>
    </div>

    <script>
        const CONFIG = { password: 'englishlanguage123' };
        
        const SUPABASE_URL = 'https://ltayjvtqpoapgxxhhiwm.supabase.co'; 
        const SUPABASE_KEY = 'sb_publishable_l3jrBydz5KFN31Wqjv2UcA_0s0gIBT5';
        
        // Initializing client directly from global scope
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        let isAuthenticated = false;

        // Fetch shared page layout from Supabase on load
        window.addEventListener('DOMContentLoaded', async () => {
            const { data, error } = await supabaseClient
                .from('portfolio_data')
                .select('content')
                .eq('id', 'hub_layout')
                .single();

            if (data && data.content) {
                document.getElementById('hub-container').innerHTML = data.content;
            }
        });

        function toggleEditMode() {
            if (!isAuthenticated) {
                const input = prompt("Enter password:");
                if (input === CONFIG.password) {
                    isAuthenticated = true;
                    enableEditing();
                } else if (input !== null) {
                    alert("Incorrect password.");
                }
            } else {
                saveAndDisableEditing();
            }
        }

        function enableEditing() {
            document.querySelectorAll('.sub-heading-link').forEach(link => {
                if (link.hasAttribute('href')) {
                    link.setAttribute('data-target-href', link.getAttribute('href'));
                    link.removeAttribute('href');
                }
            });

            document.querySelectorAll('.main-heading, .topic-description, .genre-tag, .sub-heading-link strong, .essay-desc').forEach(makeEditable);

            document.querySelectorAll('.topic-section').forEach(section => {
                if (!section.querySelector('.add-link-btn')) {
                    const addLinkBtn = document.createElement('button');
                    addLinkBtn.className = 'add-link-btn';
                    addLinkBtn.innerText = '➕ Add Essay Subheading';
                    addLinkBtn.style.cssText = 'margin-top: 15px; padding: 6px 12px; background: #edf2f7; color: #2d3748; border: 1px solid #cbd5e0; border-radius: 4px; cursor: pointer; font-size: 0.85rem; font-weight: bold; display: block;';
                    addLinkBtn.onclick = () => addSubHeading(section);
                    section.appendChild(addLinkBtn);
                }
            });
            
            const btn = document.getElementById('edit-btn');
            btn.innerText = "💾 Save & Sync Live";
            btn.style.backgroundColor = "#2b6cb0";

            document.getElementById('add-section-btn').style.display = "inline-block";
        }

        async function saveAndDisableEditing() {
            document.querySelectorAll('.sub-heading-link').forEach(link => {
                const target = link.getAttribute('data-target-href') || 'essays/placeholder.html';
                link.setAttribute('href', target);
                link.removeAttribute('data-target-href');
            });

            document.querySelectorAll('.add-link-btn').forEach(btn => btn.remove());
            
            document.querySelectorAll('[contenteditable]').forEach(el => {
                el.removeAttribute('contenteditable');
                el.style.outline = "";
                el.style.padding = "";
                el.style.backgroundColor = "";
            });

            const containerHTML = document.getElementById('hub-container').innerHTML;

            const { error } = await supabaseClient
                .from('portfolio_data')
                .upsert({ id: 'hub_layout', content: containerHTML });

            if (error) {
                alert("Error syncing to cloud database: " + error.message);
            } else {
                alert("Changes synced live to cloud database!");
            }

            const btn = document.getElementById('edit-btn');
            btn.innerText = "✏️ Live Edit";
            btn.style.backgroundColor = "#1a202c";

            document.getElementById('add-section-btn').style.display = "none";
            isAuthenticated = false;
        }

        function makeEditable(el) {
            el.contentEditable = "true";
            el.style.outline = "2px dashed #2b6cb0";
            el.style.padding = "2px 4px";
            el.style.backgroundColor = "#fffde7";
        }

        function addMainHeading() {
            if (!isAuthenticated) return;

            const container = document.getElementById('hub-container');
            const newSection = document.createElement('section');
            newSection.className = 'topic-section';
            
            newSection.innerHTML = `
                <h2 class="main-heading">New Category Heading</h2>
                <p class="topic-description">Category description here...</p>
                <ul class="essay-links-list">
                    <li>
                        <a data-target-href="essays/placeholder.html" class="sub-heading-link">
                            <span class="genre-tag">Informative</span>
                            <strong>New Essay Title:</strong>
                            <span class="essay-desc">Brief description</span>
                        </a>
                    </li>
                </ul>
            `;

            container.appendChild(newSection);
            newSection.querySelectorAll('.main-heading, .topic-description, .genre-tag, .sub-heading-link strong, .essay-desc').forEach(makeEditable);
            
            const addLinkBtn = document.createElement('button');
            addLinkBtn.className = 'add-link-btn';
            addLinkBtn.innerText = '➕ Add Essay Subheading';
            addLinkBtn.style.cssText = 'margin-top: 15px; padding: 6px 12px; background: #edf2f7; color: #2d3748; border: 1px solid #cbd5e0; border-radius: 4px; cursor: pointer; font-size: 0.85rem; font-weight: bold; display: block;';
            addLinkBtn.onclick = () => addSubHeading(newSection);
            newSection.appendChild(addLinkBtn);
        }

        function addSubHeading(sectionElement) {
            if (!isAuthenticated) return;

            const list = sectionElement.querySelector('.essay-links-list');
            const newLi = document.createElement('li');

            newLi.innerHTML = `
                <a data-target-href="essays/placeholder.html" class="sub-heading-link">
                    <span class="genre-tag">Opinion</span>
                    <strong>New Title:</strong>
                    <span class="essay-desc">Brief description</span>
                </a>
            `;

            list.appendChild(newLi);
            newLi.querySelectorAll('.genre-tag, strong, .essay-desc').forEach(makeEditable);
        }
    </script>
</body>
</html>
