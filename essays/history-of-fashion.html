<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>The History of Fashion</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
</head>
<body>

    <!-- Editable Content Wrapper -->
    <main id="essay-content">
        <h1>The History of Fashion</h1>
        <p>Type your essay content here...</p>
    </main>

    <!-- Save Controls -->
    <div style="position: fixed; bottom: 20px; right: 20px;">
        <button onclick="enableEssayEditing()" style="padding: 10px 15px; background: #1a202c; color: white; border: none; border-radius: 5px; cursor: pointer;">✏️ Edit</button>
        <button onclick="saveEssay()" style="padding: 10px 15px; background: #2b6cb0; color: white; border: none; border-radius: 5px; cursor: pointer;">💾 Save Live</button>
    </div>

    <script>
        const CONFIG = { password: 'englishlanguage123' };
        const SUPABASE_URL = 'https://ltayjvtqpoapgxxhhiwm.supabase.co'; 
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imx0YXlqdnRxcG9hcGd4eGhoaXdtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkzMDUwNDYsImV4cCI6MjEwNDg4MTA0Nn0.NvUJ3n-9dRIuNEriKa0YTNp3sZA9YTScxQrksfEchCI';
        
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        const ESSAY_ID = 'essay_history_of_fashion'; 

        // 1. Fetch live data from Supabase on load
        window.addEventListener('DOMContentLoaded', async () => {
            const { data } = await supabaseClient
                .from('portfolio_data')
                .select('content')
                .eq('id', ESSAY_ID)
                .maybeSingle();

            if (data && data.content) {
                document.getElementById('essay-content').innerHTML = data.content;
            }
        });

        // 2. Enable editing in the browser
        function enableEssayEditing() {
            const pwd = prompt("Enter password:");
            if (pwd !== CONFIG.password) return alert("Incorrect password");
            
            const area = document.getElementById('essay-content');
            area.contentEditable = "true";
            area.style.outline = "2px dashed #2b6cb0";
            area.style.padding = "10px";
        }

        // 3. Save directly to Supabase
        async function saveEssay() {
            const area = document.getElementById('essay-content');
            area.removeAttribute('contenteditable');
            area.style.outline = "";

            const contentHTML = area.innerHTML;
            const { error } = await supabaseClient
                .from('portfolio_data')
                .upsert({ id: ESSAY_ID, content: contentHTML });

            if (error) {
                alert("Error saving: " + error.message);
            } else {
                alert("Essay saved live to database!");
            }
        }
    </script>
</body>
</html>
